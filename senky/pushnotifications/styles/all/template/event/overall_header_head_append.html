{% if S_REGISTERED_USER and not S_IS_BOT and S_SENKY_PUSHNOTIFICATIONS %}
	<script>
		var senky_pushnotifications = {
			lang: {
				ENABLED: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_ENABLED') | e('js') }}',
				ENABLED_SHORT: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_ENABLED_SHORT') | e('js') }}',
				OFF: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_DISABLED') | e('js') }}',
				OFF_SHORT: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_DISABLED_SHORT') | e('js') }}',
				DISALLOWED: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_DISALLOWED') | e('js') }}', // TODO: presny navod pre kazdy prehliadac
				DISALLOWED_SHORT: '{{ lang('BROWSER_NOTIFICATIONS_ACTION_DISALLOWED_SHORT') | e('js') }}', // TODO: presny navod pre kazdy prehliadac

				UNSUBSCRIBE_FAILED: '{{ lang('BROWSER_NOTIFICATIONS_UNSUBSCRIBE_FAILED') | e('js') }}',
				MANUAL_TITLE: '{{ lang('BROWSER_NOTIFICATIONS_MANUAL_TITLE') | e('js') }}',
				MANUAL_DESC_CHROME: '{{ lang('BROWSER_NOTIFICATIONS_MANUAL_CHROME') | e('js') }}',

			notification_method_name: '{{ lang('SENKY_PUSHNOTIFICATIONS_NOTIFICATION_METHOD_BROWSER') }}',

			popupMethod: '{{ S_SENKY_PUSHNOTIFICATIONS_POPUP_METHOD | e('js') }}'

	{% INCLUDEJS '@senky_pushnotifications/js/notifications.min.js' %}

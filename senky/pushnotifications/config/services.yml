services:
    senky.pushnotifications.service_worker:
        class: senky\pushnotifications\controller\service_worker
        arguments:
            - '@config'
            - '@controller.helper'
            - '@user'
            - '@language'
            - '@auth'
            - '%core.root_path%'

    senky.pushnotifications.controller:
        class: senky\pushnotifications\controller\main
        arguments:
            - '@user'
            - '@dbal.conn'
            - '@config'
            - '@controller.helper'
            - '@request'
            - '@auth'
            - '%core.php_ext%'
            - '%core.root_path%'
            - '%core.table_prefix%push_subscriptions'

    senky.pushnotifications.listener:
        class: senky\pushnotifications\event\main_listener
        arguments:
            - '@template'
            - '@config'
            - '@controller.helper'
            - '@auth'
        tags:
            - { name: event.listener }

    senky.pushnotifications.notification.method.browser:
        class: senky\pushnotifications\notification\method\browser
        shared: false
        arguments:
            - '@user_loader'
            - '@user'
            - '@config'
            - '@dbal.conn'
            - '@log'
            - '@filesystem'
            - '@auth'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.table_prefix%push_subscriptions'
        tags:
            - { name: notification.method }
